[project]
name = "bank-enrichment"
version = "0.1.0"
description = "Enriching bank information with user context"
authors = [
    {name = "Samuel Mason"}
]
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "python-dotenv (>=1.2.2,<2.0.0)",
    "fastapi (>=0.136.1,<0.137.0)",
    "uvicorn (>=0.46.0,<0.47.0)",
    "pydantic (>=2.13.4,<3.0.0)",
    "requests (>=2.33.1,<3.0.0)",
    "duckdb (>=1.5.2,<2.0.0)",
    "jinja2 (>=3.1.0,<4.0.0)",
    "aiofiles (>=24.0.0,<25.0.0)",
    "python-multipart (>=0.0.9)",
    "telegram (>=0.0.1,<0.0.2)",
    "anthropic (>=0.104.1,<0.105.0)",
    "streamlit (>=1.57.0,<2.0.0)",
    "plotly (>=6.7.0,<7.0.0)",
    "pandas (>=3.0.3,<4.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
