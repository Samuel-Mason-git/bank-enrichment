[project]
name = "bank-enrichment"
version = "0.1.0"
description = "Enriching bank information with user context"
authors = [
    {name = "Samuel Mason"}
]
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "python-dotenv (>=1.2.2,<2.0.0)",
    "fastapi (>=0.136.1,<0.137.0)",
    "uvicorn (>=0.46.0,<0.47.0)",
    "pydantic (>=2.13.4,<3.0.0)",
    "requests (>=2.33.1,<3.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "ngrok (>=1.7.0,<2.0.0)"
]
