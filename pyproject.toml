[project]
name = "bank-enrichment"
version = "0.1.0"
description = "Enriching bank information with user context"
authors = [
    {name = "Samuel Mason"}
]
license = "MIT"
requires-python = ">=3.11"
# Only what the SERVER needs (src/server, run in Docker). The pipeline and
# dashboard dependencies live in the "local" group below, so the server image can
# install just this group and stay small: the Dockerfile uses `--only main`.
dependencies = [
    "fastapi (>=0.136.1,<0.137.0)",
    "uvicorn (>=0.46.0,<0.47.0)",
    "pydantic (>=2.13.4,<3.0.0)",
    "requests (>=2.33.1,<3.0.0)",
    "jinja2 (>=3.1.0,<4.0.0)",
    "aiofiles (>=24.0.0,<25.0.0)",
    "python-multipart (>=0.0.9)",
    "psycopg[binary] (>=3.2,<4.0)"
]


# The daily run (src/pipeline/process.py), which the server image runs as
# its `worker` container: the Dockerfile installs `--only main,worker`.
[tool.poetry.group.worker.dependencies]
python-dotenv = ">=1.2.2,<2.0.0"
anthropic = ">=0.104.1,<0.105.0"

# The Streamlit dashboard, on your own machine. Installed by a plain
# `poetry install` like any other group, so local setup and CI are unchanged.
[tool.poetry.group.local.dependencies]
streamlit = ">=1.57.0,<2.0.0"
plotly = ">=6.7.0,<7.0.0"
pandas = ">=3.0.3,<4.0.0"

[tool.poetry.group.dev.dependencies]
pytest = ">=8.0.0"
pytest-cov = ">=5,<8"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
