<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>{% block title %}Bank Enrichment{% endblock %}</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💳</text></svg>">
    <link rel="stylesheet" href="/static/style.css?v={{ static_version }}">
</head>
<body>

<header>
    <div class="header-brand">
        <div class="dot"></div>
        <h1>Bank Enrichment</h1>
    </div>
    <div class="header-right">
        <nav class="header-nav">
            <a href="/dashboard" class="nav-link{% if active_nav == 'dashboard' %} active{% endif %}">Dashboard</a>
            <a href="/dashboard/rules" class="nav-link{% if active_nav == 'rules' %} active{% endif %}">Rules</a>
            <a href="/dashboard/db" class="nav-link{% if active_nav == 'db' %} active{% endif %}">Database</a>
        </nav>
        <a href="/dashboard/logout" class="nav-logout">Logout</a>
    </div>
</header>

<main>
{% block content %}{% endblock %}
</main>

{% block extra_body %}{% endblock %}

</body>
</html>
