services:
  bank-enrichment:
    build: .
    expose:
      - "8000"
    volumes:
      - ./data:/app/data
    env_file:
      - ./config/.env
    restart: unless-stopped

  caddy:
    image: caddy:latest
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
