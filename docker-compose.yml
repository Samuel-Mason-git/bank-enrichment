x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  bank-enrichment:
    build: .
    image: bank-enrichment
    expose:
      - "8000"
    volumes:
      - ./data:/app/data
    env_file:
      - ./config/.env
    depends_on:
      db:
        condition: service_healthy
        required: false
    restart: unless-stopped
    logging: *default-logging

  # The pipeline's runs (src/pipeline/worker.py): the same image, every hour
  # from 08:00 to 22:00 London time. Capped, so a run that ever spikes is what gets
  # stopped, not the webhooks next to it.
  worker:
    image: bank-enrichment
    command: ["python", "src/pipeline/worker.py"]
    volumes:
      - ./data:/app/data
    env_file:
      - ./config/.env
    environment:
      TZ: Europe/London
      LOG_DIR: /app/data/logs
    mem_limit: 350m
    depends_on:
      bank-enrichment:
        condition: service_started
      db:
        condition: service_healthy
        required: false
    restart: unless-stopped
    logging: *default-logging

  # The live database, if you don't have one: `docker compose --profile local-db up -d db`.
  # Off unless that profile is asked for, so an existing database is unchanged. Its
  # settings come from config/db.env (written by the setup command). It's published on
  # 127.0.0.1 only, so the dashboard reaches it through an SSH tunnel and the internet
  # can't.
  db:
    profiles: ["local-db"]
    image: postgres:18
    env_file:
      - ./config/db.env
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped
    logging: *default-logging

  caddy:
    # A fixed version, not :latest, so a rebuild never picks up a change
    # unannounced; Dependabot proposes updates.
    image: caddy:2.11.7
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped
    logging: *default-logging

volumes:
  caddy_data:
  caddy_config:
  pgdata:
