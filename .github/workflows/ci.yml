name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    # A throwaway Postgres, started empty for this run and gone afterwards. The
    # Postgres tests (the `pg` fixture) build their own tables in it; it never
    # sees real data. Same major version as the data box.
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_POSTGRES_URL: postgresql://postgres:ci@localhost:5432/postgres
      # Here a missing Postgres must fail the run, not quietly skip its tests.
      REQUIRE_POSTGRES_TESTS: "1"

    steps:
      - uses: actions/checkout@v7

      # The image's Python (Dockerfile: python:3.11-slim), so the tests run on
      # what production runs. Read from pyproject's ">=3.11" this was always the
      # newest Python, and a brand-new one has no ready-built wheels for some
      # dependencies yet -- the install then tries to compile them, and fails.
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install Poetry
        run: pipx install poetry

      - name: Install dependencies
        run: poetry install --no-root

      # With coverage: the report (which lines no test reaches) is in this
      # step's log, and the run fails if the total drops below 80%.
      - name: Run tests
        run: poetry run pytest --tb=short -q --cov=src --cov-report=term-missing:skip-covered --cov-fail-under=80

  # The server image installs only the "main" dependency group and copies only the
  # server's files, so a dependency or file it needs but no longer gets would break
  # production at startup and nothing else here would notice: the tests run against
  # the full environment. Build the real image and import the real modules from it.
  docker:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Build the server image
        run: docker build -t bank-enrichment-server .

      - name: Smoke test the server image
        run: |
          docker run --rm -w /app \
            -e TELEGRAM_API=ci -e TELEGRAM_CHAT_ID=1 \
            bank-enrichment-server \
            python -c "import os, sys; sys.path.insert(0, 'src/server'); import server_db, telegram, check_rules, follow_up_tg, main; assert os.path.isfile(server_db.SCHEMA_PATH), 'schema.sql is missing from the image'; print('server modules import OK')"

      # The worker runs the pipeline from the same image: everything it imports
      # has to be there, and the dashboard's heavy dependencies must not be.
      - name: Smoke test the worker
        run: |
          docker run --rm -w /app -e TZ=Europe/London \
            -e TELEGRAM_API=ci -e TELEGRAM_CHAT_ID=1 \
            bank-enrichment-server \
            python -c "import importlib.util as u, sys, time; sys.path.insert(0, 'src/pipeline'); import worker, process; missing = [m for m in ('pandas', 'streamlit', 'plotly') if u.find_spec(m)]; assert not missing, f'dashboard packages in the image: {missing}'; assert time.strftime('%Z') in ('GMT', 'BST'), time.strftime('%Z'); print('worker imports OK, London time')"

  # Only rebuild the server when something it or the worker is made of changed. A
  # dashboard change has no business restarting a service that is receiving live
  # bank webhooks.
  changes:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      server: ${{ steps.filter.outputs.server }}

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - id: filter
        run: |
          before="${{ github.event.before }}"
          # No usable "before" (first push, force push): deploy rather than guess.
          if [ -z "$before" ] || [ "$before" = "0000000000000000000000000000000000000000" ] \
             || ! git cat-file -e "${before}^{commit}" 2>/dev/null; then
            echo "No comparable previous commit -- deploying to be safe"
            echo "server=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed=$(git diff --name-only "$before" "${{ github.sha }}")
          echo "Files changed in this push:"
          echo "$changed"
          if echo "$changed" | grep -E -q '^(src/server/|src/pipeline/|sql/postgres/schema\.sql$|Dockerfile$|\.dockerignore$|docker-compose\.yml$|Caddyfile$|pyproject\.toml$|poetry\.lock$)'; then
            echo "server=true" >> "$GITHUB_OUTPUT"
          else
            echo "Nothing the server is built from changed -- skipping deploy"
            echo "server=false" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    needs: [test, docker, changes]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.changes.outputs.server == 'true'
    runs-on: ubuntu-latest
    # Two deploys at once would run two builds and two container swaps on one small
    # box. Queue behind the running one instead of cancelling it mid-build.
    concurrency:
      group: deploy-production
      cancel-in-progress: false

    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          # The action's default is 10 minutes, which a cold Docker build can exceed.
          command_timeout: 30m
          # Another project deploys to this server too. Both builds take this
          # lock, so they wait for each other instead of building at once --
          # two at once on 1 GB is what hung the server in September.
          script: |
            set -e
            cd /home/ubuntu/bank-enrichment
            git pull
            flock /home/ubuntu/.deploy.lock docker compose up -d --build
            docker compose exec -T caddy caddy reload --config /etc/caddy/Caddyfile --adapter caddyfile
            docker image prune -f
